[project]
name = "davm"
version = "0.1.0"
description = "Digital Assistant Virtual Mech - An LLM-powered agent with persistent memory, file access, and web capabilities"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "tha_magick_man" }
]
dependencies = [
    "anthropic>=0.40.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
davm = "davm.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["davm"]
